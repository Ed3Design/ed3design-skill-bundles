version: 2

# Dependabot configuration for ed3design-skill-bundles.
# Updates are batched monthly; major-version bumps need manual review.
# Monthly rather than weekly: this repo has no runtime users to protect — the
# deps are CI tooling (actions, the Claude Code CLI) and optional tool extras.
# A weekly cadence produced more review load than the updates were worth; four
# PRs had accumulated unreviewed by 2026-09-24. Security advisories are NOT
# affected by this setting — Dependabot raises those regardless of schedule.

updates:
  # GitHub Actions used in .github/workflows/*.yml
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-minor:
        update-types:
          - "minor"
          - "patch"

  # Python tool dependencies declared in pyproject.toml
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-minor:
        update-types:
          - "minor"
          - "patch"

  # npm — Claude Code CLI is the only npm dep we install in CI
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
